[project]
name = "lol-items"
version = "1.0.0"
description = "Full-stack CRRUD app: FastAPI API, Flask frontend, pytest tests"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "flask>=3.0",
    "requests>=2.31",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
